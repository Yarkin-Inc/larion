plugins { id 'net.fabricmc.fabric-loom' version '1.15.5' }
apply from: rootProject.file('gradle/loader-common.gradle')
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}
loom {
    accessWidenerPath.set(rootProject.file('common/src/main/resources/larion.accesswidener'))
    runs {
        client { runDir('run/client') }
        server {
            runDir(project.relativePath(file(providers.gradleProperty('serverRunDir').getOrElse('run/server'))))
            programArg 'nogui'
        }
    }
}

// Exercise shared density functions against vanilla Minecraft on Fabric's test classpath.
sourceSets.test.java.srcDir rootProject.file('common/src/test/java')
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
