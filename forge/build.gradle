plugins { id 'net.minecraftforge.gradle' version '7.0.29' }
apply from: rootProject.file('gradle/loader-common.gradle')

fgtools.configure('slimelauncher') {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(java_version.toInteger())
    }
}

sourceSets.main.output.resourcesDir = tasks.named('compileJava', JavaCompile).flatMap { it.destinationDirectory }.get().asFile

minecraft {
    accessTransformer = true
    runs {
        configureEach { args '--mixin.config=larion.mixins.json' }
        register('client') { workingDir = layout.projectDirectory.dir('run/client') }
        register('server') { workingDir = file(providers.gradleProperty('serverRunDir').getOrElse('run/server')); args '--nogui' }
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}
tasks.named('jar', Jar) { manifest.attributes['MixinConfigs'] = 'larion.mixins.json' }
