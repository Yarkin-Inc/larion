apply plugin: 'java-library'
version = project.property('version')
group = project.property('group')
base { archivesName = "${mod_id}-${project.name}-${minecraft_version}" }
def targetJavaVersion = project.property('java_version').toString().toInteger()
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}
tasks.named('processResources') {
    def props = ['version', 'group', 'minecraft_version', 'minecraft_version_range',
        'minecraft_version_range_fabric', 'fabric_version', 'fabric_loader_version',
        'neoforge_version', 'forge_version', 'mod_name', 'mod_author', 'mod_id',
        'license', 'description', 'credits', 'java_version'].collectEntries {
        [(it): project.property(it).toString()]
    }
    inputs.properties(props)
    filesMatching(['fabric.mod.json', 'pack.mcmeta', '*.mixins.json', 'META-INF/*.toml']) { expand(props) }
    exclude 'META-INF/accesstransformer-common.cfg'
    if (project.name != 'fabric') exclude '*.accesswidener'
}
tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE')) { rename { "${it}_${mod_id}" } }
}
tasks.named('sourcesJar', Jar) {
    from(rootProject.file('LICENSE')) { rename { "${it}_${mod_id}" } }
}
